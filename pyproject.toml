[project]
name = "locki"
version = "0.0.26"
description = "AI sandboxing without the taste of sand"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jan Pokorný" }]
keywords = ["sandbox", "ai", "agents", "coding-agent", "incus", "lima", "vm", "devcontainer", "worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "asyncssh>=2.18",
    "click>=8.1",
    "InquirerPy>=0.3",
    "lark>=1.3",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/JanPokorny/locki"
Repository = "https://github.com/JanPokorny/locki"
Issues = "https://github.com/JanPokorny/locki/issues"

[dependency-groups]
dev = [
    "pyrefly>=0.60.1",
    "ruff>=0.15.7",
    "wheel>=0.46.3",
]

[project.scripts]
locki = "locki:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = [
    "E", "W", "F", "UP", "I", "B", "N", "C4", "Q", "SIM", "RUF", "TID", "ASYNC",
]
lint.ignore = ["E501"]
force-exclude = true

[tool.pyrefly]
project_includes = ["src"]
python_version = "3.11"

[tool.uv]
exclude-newer = "P7D"
exclude-newer-package = {}
